name: Deploy database and tasks

# Vercel deploys the app from GitHub on its own. This workflow applies migrations to the matching
# Supabase project and deploys Trigger.dev tasks to the matching environment (spec 0001):
#   main       -> staging
#   production -> prod

on:
  push:
    branches: [main, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      # Until the Supabase project exists and its connection string is a repo secret (README, one
      # time setup), skip instead of failing. The push starts working the moment the secret is set.
      - name: Check the database secret
        id: check
        env:
          DB_URL: ${{ github.ref_name == 'production' && secrets.PROD_SUPABASE_DB_URL || secrets.STAGING_SUPABASE_DB_URL }}
          # The ref of the [remotes.<name>] block in supabase/config.toml for this branch. Empty for
          # production until that project exists (an empty string is falsy in an Actions expression,
          # so the staging ref sits on the true side of the `&&`).
          PROJECT_REF: ${{ github.ref_name != 'production' && 'fxmdkvhououxakmyddwn' || '' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_EMAIL_SMTP_PASS: ${{ secrets.SUPABASE_AUTH_EMAIL_SMTP_PASS }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
        run: |
          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"
          if [ -n "$DB_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migrations skipped::The Supabase database URL secret for this branch is not set yet. See README, one time setup, Supabase."
          fi
          # The Auth config push needs the management API token, the SMTP password and the Google
          # client that supabase/config.toml reads through env(), and a project ref for this branch.
          # The CLI sends the enabled SMTP and provider blocks with whatever the variables resolve
          # to, so pushing without them would blank the hosted credentials; skip instead.
          if [ -n "$DB_URL" ] && [ -n "$PROJECT_REF" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_AUTH_EMAIL_SMTP_PASS" ] && [ -n "$SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID" ] && [ -n "$SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET" ]; then
            echo "config=true" >> "$GITHUB_OUTPUT"
          else
            echo "config=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Auth config push skipped::Set SUPABASE_ACCESS_TOKEN, SUPABASE_AUTH_EMAIL_SMTP_PASS, SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID and SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET for this environment, and give the branch a project ref in deploy.yml plus a matching [remotes.<name>] block in supabase/config.toml. See docs/auth.md, hosted projects."
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0 # keep in step with the `supabase` dev dependency; `latest` can resolve to a prerelease
      - name: supabase db push
        if: steps.check.outputs.configured == 'true'
        env:
          DB_URL: ${{ github.ref_name == 'production' && secrets.PROD_SUPABASE_DB_URL || secrets.STAGING_SUPABASE_DB_URL }}
        run: supabase db push --db-url "$DB_URL"
      # Auth settings (OTP length and expiry, confirmations, password length, site and redirect
      # URLs, email templates, hook, SMTP) come from supabase/config.toml and its [remotes.<name>]
      # block for this project (docs/auth.md). The project ref is the same one as in that block.
      - name: supabase config push
        if: steps.check.outputs.config == 'true'
        env:
          PROJECT_REF: ${{ steps.check.outputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_AUTH_EMAIL_SMTP_PASS: ${{ secrets.SUPABASE_AUTH_EMAIL_SMTP_PASS }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
        run: supabase config push --project-ref "$PROJECT_REF" --yes

  tasks:
    name: Deploy Trigger.dev tasks
    runs-on: ubuntu-latest
    needs: migrate
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      # Same idea: no Trigger.dev access token yet means skip, not fail.
      - name: Check the Trigger.dev secret
        id: check
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          if [ -n "$TRIGGER_ACCESS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Task deploy skipped::TRIGGER_ACCESS_TOKEN is not set yet. See README, one time setup, Trigger.dev."
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - name: trigger.dev deploy
        if: steps.check.outputs.configured == 'true'
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm trigger:deploy:${{ github.ref_name == 'production' && 'prod' || 'staging' }}
