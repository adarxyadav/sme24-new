name: End to end

# Runs Playwright with axe against every successful Vercel deployment (previews, staging, prod).
on:
  deployment_status:

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success'
    name: Playwright + axe against the deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the suite against the deployment URL
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          # Set as a repo secret once the seed has been applied to staging; the role gate test skips without it.
          E2E_SEED_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD }}
          # Vercel project setting "Protection Bypass for Automation"; without it every page is Vercel's login screen.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm test:e2e
      - name: Check the first load JavaScript budget of the marketing pages
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm budget --url "$PLAYWRIGHT_BASE_URL"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 7
